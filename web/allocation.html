<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#103c39" />
    <title>股债配置 · 格间</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/notebooks.js"></script>
  </head>
  <body data-section="allocation">
    <header>
      <div class="top">
        <div class="brand">
          <i class="mark" aria-hidden="true"><b></b><b></b><b></b></i
          ><strong>格间</strong><span></span>A股策略控制台
        </div>
      </div>
    </header>
    <!-- strategy-nav -->
    <main>
      <div class="intro">
        <div>
          <h1>股债配置</h1>
          <p>录入两类资产的当前市值，查看实际权重与目标之间的差额。</p>
        </div>
      </div>
      <div class="workspace notebook">
        <section class="panel formpanel">
          <div class="panelhead"><h2>组合参数</h2></div>
          <form id="entry">
            <div class="fields">
              <label
                >组合名称<input
                  type="text"
                  name="name"
                  maxlength="40"
                  placeholder="输入组合名称"
                  required
              /></label>
              <label
                >红利权益目标权重（%）<input
                  type="number"
                  name="target"
                  min="0"
                  max="100"
                  step=".01"
                  required
              /></label>
              <label
                >红利权益市值（元）<input
                  type="number"
                  name="equity"
                  min="0"
                  max="1000000000000"
                  step=".01"
                  required
              /></label>
              <label
                >债券资产市值（元）<input
                  type="number"
                  name="bonds"
                  min="0"
                  max="1000000000000"
                  step=".01"
                  required
              /></label>
            </div>
            <div class="save-row">
              <button class="primary" id="save">保存组合</button
              ><span id="save-status" role="status"></span>
            </div>
          </form>
        </section>
        <section class="panel result">
          <div class="panelhead"><h2>配置测算</h2></div>
          <dl>
            <div>
              <dt>组合总市值</dt>
              <dd id="total">—</dd>
            </div>
            <div>
              <dt>当前红利权益权重</dt>
              <dd id="weight">—</dd>
            </div>
            <div>
              <dt>权益权重偏离目标</dt>
              <dd id="gap">—</dd>
            </div>
            <div>
              <dt>权益市值调整额</dt>
              <dd id="change">—</dd>
            </div>
          </dl>
          <p id="result-note"></p>
        </section>
      </div>
      <section class="panel orders">
        <div class="panelhead">
          <h2>我的组合</h2>
          <span id="count" class="count">0</span>
        </div>
        <div class="scroll">
          <table hidden id="records">
            <thead>
              <tr>
                <th scope="col">组合名称</th>
                <th scope="col">组合市值</th>
                <th scope="col">实际权益权重</th>
                <th scope="col">目标权益权重</th>
                <th scope="col">操作</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="empty" class="empty"><strong>暂无已保存的组合</strong></div>
      </section>
    </main>
  </body>
</html>
