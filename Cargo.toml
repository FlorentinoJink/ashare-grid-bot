[package]
name = "ashare-grid-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Local A-share grid signal desk with Feishu delivery"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls","system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio","sqlite"] }
tokio = { version = "1", features = ["macros","rt-multi-thread","net","time","signal"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
uuid = { version = "1", features = ["v4"] }
